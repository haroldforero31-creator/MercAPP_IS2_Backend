name: MercAPP CI — Tests y Cobertura

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Ejecutar pruebas unitarias con cobertura
      run: |
        python -m pytest tests/ -v --cov=controllers --cov=services --cov=utilities --cov=models --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml:coverage.xml

    - name: Verificar calidad de cobertura (Gate de CI >= 70%)
      run: |
        python -m pytest tests/ --cov=controllers --cov=services --cov=utilities --cov=models --cov-fail-under=70

    - name: Subir reporte de cobertura como artefacto
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/
