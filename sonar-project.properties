sonar.projectKey=haroldforero31-creator_MercAPP_IS2_Backend
sonar.organization=haroldforero31-creator
sonar.projectName=MercAPP_IS2_Backend
sonar.projectVersion=2.0

# Archivos a escanear
sonar.sources=.
sonar.exclusions=venv/**,build/**,dist/**,htmlcov/**,uploads/**,MercAPP_IS2_Windows/**,*.rar,*.zip,*.db,static/vendor/**,static/js/JsBarcode.all.min.js,**/*.min.js

# Directorio de pruebas y reporte de cobertura
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.11, 3.12

# Exclusiones de duplicación para plantillas y assets estáticos
sonar.cpd.exclusions=templates/**,static/**

# Excepciones de reglas de seguridad justificadas
sonar.issue.ignore.multicriteria=e1,e2
# e1: Endpoint REST API publico sin cookies para emision de JWT
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S4502
sonar.issue.ignore.multicriteria.e1.resourceKey=app.py
# e2: Generador de codigo de barras interno
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e2.resourceKey=app.py

