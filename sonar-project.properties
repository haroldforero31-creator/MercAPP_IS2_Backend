sonar.projectKey=haroldforero31-creator_MercAPP_IS2_Backend
sonar.organization=haroldforero31-creator
sonar.projectName=MercAPP_IS2_Backend
sonar.projectVersion=2.0

# Archivos a escanear (excluyendo CI, scripts de build y dependencias empaquetadas)
sonar.sources=.
sonar.exclusions=venv/**,build/**,dist/**,htmlcov/**,uploads/**,MercAPP_IS2_Windows/**,*.rar,*.zip,*.db,static/vendor/**,static/js/JsBarcode.all.min.js,**/*.min.js,.github/**,*.sh

# Directorio de pruebas y reporte de cobertura
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.11, 3.12

# Exclusiones completas para analisis de duplicacion (CPD)
sonar.cpd.exclusions=**

# Exclusiones de reglas de automatizacion y flujos CI
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:*
sonar.issue.ignore.multicriteria.e1.resourceKey=**
sonar.issue.ignore.multicriteria.e2.ruleKey=shell:*
sonar.issue.ignore.multicriteria.e2.resourceKey=**
